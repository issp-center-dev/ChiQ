name: Test

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 1,15 * *' # JST 9:00 on 1st and 15th every month

jobs:
  main:
    strategy:
      matrix:
        python-version: ['3.8', '3.13']
      fail-fast: false

    name: Run tests with Python ${{ matrix.python-version }}
    runs-on: 'ubuntu-24.04'
    # runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: apt
        run: |
          sudo apt update
          sudo apt install hdf5-tools libeigen3-dev openmpi-bin libopenmpi-dev

      - name: pip
        run: |
          python -m pip install -U pip
          python -m pip install mpi4py
          python -m pip install dcore more-itertools pytest
          python -m pip freeze # for debugging

      - name: run
        run: |
          git submodule init
          git submodule update
          mkdir build
          cd build
          cmake .. -DTesting=ON
          make
          source ./chiqvars.sh
          ctest -V
          python -m pytest -v

  pip-install:
    strategy:
      matrix:
        python-version: ['3.8', '3.13']
      fail-fast: false

    name: Pip install + test with Python ${{ matrix.python-version }}
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install hdf5-tools libeigen3-dev openmpi-bin libopenmpi-dev

      - name: pip build + install + test
        run: |
          python -m pip install -U pip
          pip install .[test,plot]
          python -c "import chiq, chiq._bse_solver; print('import OK')"
          python -W ignore::FutureWarning -c "import bse, bse_solver"
          chiq_main --version
          cd /tmp
          python -m pytest "$GITHUB_WORKSPACE/tests/python/non-mpi" -q -k "not mpi"

      - name: Verify legacy and pip packaging layouts
        if: matrix.python-version == '3.13'
        run: |
          bash tests/python/non-mpi/packaging/verify_legacy_install.sh
          bash tests/python/non-mpi/packaging/verify_pip_install.sh

  pip-import-smoke:
    name: Pip import smoke with Python 3.11
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Eigen
        run: |
          sudo apt update
          sudo apt install libeigen3-dev

      - name: Install and import
        run: |
          python -m pip install -U pip
          pip install .
          cd /tmp
          python -c "import chiq, chiq._bse_solver; print('import OK')"
          python -W ignore::FutureWarning -c "import bse, bse_solver"
          chiq_main --version
